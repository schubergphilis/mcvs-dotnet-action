# yamllint disable rule:line-length
---
name: General
"on":
  pull_request:
permissions:
  contents: read
  packages: read
jobs:
  MCVS-general-action:
    strategy:
      matrix:
        args:
          - testing-type: lint-action
          - testing-type: lint-commit
          - testing-type: lint-git
          - testing-type: yamllint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: schubergphilis/mcvs-general-action@9705f65655a1848a02c368b91d14185b065ebdb5 # v0.7.3
        with:
          testing-type: ${{ matrix.args.testing-type }}
  # Builds and tests the example solution, so that a Dependabot NuGet bump that
  # breaks it, or that is out of sync with a lock file, fails the pull request.
  # The integration test starts a container, which the Docker daemon of the
  # runner provides.
  example:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore example/Example.slnx --locked-mode
      - run: dotnet test example/Example.slnx --no-restore
